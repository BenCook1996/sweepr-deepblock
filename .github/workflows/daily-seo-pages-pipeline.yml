name: "SWEEPR DeepBlock — Daily Cloud GSC/GA4 CTR, Live Rule Proof & Sitemap Pipeline"

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new programmatic SEO pages to generate (default 0 — swap-text generation paused)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  daily-seo-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
      GSC_SITE_URL: "sc-domain:sweeprdeepblock.com"
      GA4_PROPERTY_ID: "559863555"
    steps:
      - name: Checkout SWEEPR DeepBlock Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 1. Cloud Google Search Console & GA4 Funnel Sync via Service Account
        run: |
          node scripts/lib/google-cloud-api.mjs --self-test
          node scripts/cloud-gsc-ga4-sync.mjs

      - name: 2. Search-Intent Gap Miner, GSC Consolidation & Live MV3 Rule Proof Injection
        run: |
          node scripts/search-intent-gap-miner.mjs
          node scripts/daily-50-seo-pages.mjs ${{ inputs.batch_size || '0' }}
          node scripts/consolidate-and-optimize-gsc.mjs
          node scripts/enrich-pillars-with-live-proof.mjs

      - name: 3. Technical SEO Audit (Verify 0 Errors / 0 Warnings)
        run: |
          node scripts/technical-seo-audit.mjs

      - name: 4. Commit & Push Cloud SEO Updates (Railway Auto-Deploy)
        run: |
          git config user.name "SWEEPR DeepBlock SEO Bot"
          git config user.email "bot@sweeprdeepblock.com"
          git add website/ data/seo-intent-gaps.json TECHNICAL_SEO_AUDIT_LOG.md
          if git diff --staged --quiet; then
            echo "No new SEO updates today."
          else
            git commit -m "chore(seo): automated cloud GSC/GA4 sync, live MV3 proof & 295-pillar sitemap"
            git pull --rebase -X ours origin main
            git push origin main
          fi
