name: SWEEPR DeepBlock — Search-Intent Gap Miner & Pillar SEO Sync

on:
  # Paused automatic 50/day swap-text generation to prevent Scaled Content Abuse / Doorway demotions.
  # Runs Search-Intent Gap Miner & syncs the 300 indexable Pillar + Interactive Tool pages.
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of new programmatic SEO pages to generate (default 0 — swap-text generation paused)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  daily-seo-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SWEEPR DeepBlock Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22+
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Run Search-Intent Gap Miner & Sync Sitemap (0 Swap-Text Batch)
        run: |
          node scripts/search-intent-gap-miner.mjs
          node scripts/daily-50-seo-pages.mjs ${{ inputs.batch_size || '0' }}

      - name: Run Technical SEO Audit (Verify 0 Errors / 0 Warnings)
        run: |
          node scripts/technical-seo-audit.mjs

      - name: Commit & Push Intent Gaps & Sitemap Updates
        run: |
          git config user.name "SWEEPR DeepBlock SEO Bot"
          git config user.email "bot@sweeprdeepblock.com"
          git add website/ data/seo-intent-gaps.json TECHNICAL_SEO_AUDIT_LOG.md
          if git diff --staged --quiet; then
            echo "No new SEO updates today."
          else
            git commit -m "chore(seo): update search-intent gap report and verify 300-pillar sitemap"
            git pull --rebase -X ours origin main
            git push origin main
          fi
