name: "SWEEPR DeepBlock — Weekly Security & MV3 Integrity Audit"

on:
  schedule:
    - cron: "0 9 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepblock-weekly-security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Server Syntax, Technical SEO & MV3 Manifest Security
        run: |
          node --check server.js
          node scripts/technical-seo-audit.mjs
